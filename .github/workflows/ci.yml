name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts

      - name: Smoke-test binary
        run: |
          # MAGISTER env vars are intentionally unset: the server should still
          # exit cleanly with the "missing environment variables" message, proving
          # the built entrypoint loads without a runtime import crash.
          set +e
          node dist/index.js 2>&1 | tee /tmp/magister-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          grep -q "MAGISTER_SCHOOL" /tmp/magister-smoke.log
          test "$status" -eq 1
          echo "smoke test passed (expected exit code 1 with missing-env message)"

  integration:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify rustwright native binding loads
        run: node -e "const r = require('rustwright'); if (typeof r.chromium?.launch !== 'function') { throw new Error('chromium.launch not available'); } console.log('rustwright native binding OK');"

      - name: Verify rustwright chromium executable resolves
        run: node -e "const { chromium } = require('rustwright'); chromium.executablePath().then((p) => { console.log('chromium path:', p); }).catch((e) => { throw e; });"
